<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-layout">
        <div class="ambient-glow"></div>
        <div class="dot-grid"></div>
        
        <div class="auth-card">
            <div class="eyebrow">إنشاء حساب جديد</div>
            <h1 class="title">ابدأ رحلتك التعليمية</h1>
            <p class="subtitle">سجّل بياناتك وسنتواصل معك لتأكيد الانضمام</p>
            
            <form id="registerForm" class="auth-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">الاسم الأول</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">الاسم الأخير</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" required>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="grade">الصف الدراسي</label>
                        <select id="grade" required>
                            <option value="">اختر الصف...</option>
                            <option value="bac1">أولى بكالوريا</option>
                            <option value="bac2">تانية بكالوريا</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="city">المحافظة / الموقع</label>
                        <select id="city" required>
                            <option value="">اختر...</option>
                            <option value="cairo">القاهرة</option>
                            <option value="giza">الجيزة</option>
                            <option value="alex">الإسكندرية</option>
                            <option value="online">أونلاين</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required>
                    <div class="strength-meter">
                        <div class="strength-segment" id="seg1"></div>
                        <div class="strength-segment" id="seg2"></div>
                        <div class="strength-segment" id="seg3"></div>
                        <div class="strength-segment" id="seg4"></div>
                    </div>
                    <div class="strength-text" id="strengthText">أدخل كلمة المرور</div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">أوافق على <a href="#">الشروط والأحكام</a> و<a href="#">سياسة الخصوصية</a></label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">إنشاء حساب</button>
                
                <div class="form-footer">
                    لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
                </div>
            </form>
            
            <div id="successState" class="success-state hidden">
                <div class="success-icon">🎉</div>
                <h2>تم إنشاء حسابك بنجاح!</h2>
                <p>سنتواصل معك قريباً لتأكيد الانضمام.</p>
                <a href="dashboard.html" class="btn btn-primary">الذهاب للوحة التحكم</a>
            </div>
        </div>
    </div>
    
    <script>
        const passwordInput = document.getElementById('password');
        const segments = [
            document.getElementById('seg1'),
            document.getElementById('seg2'),
            document.getElementById('seg3'),
            document.getElementById('seg4')
        ];
        const strengthText = document.getElementById('strengthText');
        
        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            
            if (val.length > 0) {
                if (val.length >= 8) strength++;
                if (/[0-9]/.test(val)) strength++;
                if (/[A-Z]/.test(val)) strength++;
                if (/[^a-zA-Z0-9]/.test(val)) strength++;
            }
            
            segments.forEach(seg => {
                seg.className = 'strength-segment';
            });
            
            if (val.length === 0) {
                strengthText.textContent = 'أدخل كلمة المرور';
                return;
            }
            
            if (strength <= 1) {
                segments[0].classList.add('weak');
                strengthText.textContent = 'ضعيفة';
                strengthText.style.color = '#ef4444'; // Red
            } else if (strength === 2) {
                segments[0].classList.add('fair');
                segments[1].classList.add('fair');
                strengthText.textContent = 'متوسطة';
                strengthText.style.color = '#eab308'; // Yellow
            } else if (strength === 3) {
                segments[0].classList.add('good');
                segments[1].classList.add('good');
                segments[2].classList.add('good');
                strengthText.textContent = 'جيدة';
                strengthText.style.color = '#14b8a6'; // Teal
            } else {
                segments[0].classList.add('strong');
                segments[1].classList.add('strong');
                segments[2].classList.add('strong');
                segments[3].classList.add('strong');
                strengthText.textContent = 'قوية جداً';
                strengthText.style.color = 'var(--mint)';
            }
        });
        
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('successState').classList.remove('hidden');
        });
    </script>
</body>
</html>
