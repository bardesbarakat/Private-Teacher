<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب الطالب - المنصة التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="dot-grid"></div>
    <div class="auth-glow"></div>

    <header class="auth-nav">
        <div class="nav-brand">
            <div class="brand-logo">E</div>
            <span class="brand-name">إديوكيت</span>
        </div>
        <div class="nav-actions">
            <button class="btn-ghost">EN</button>
            <a href="index.html" class="btn-ghost">العودة</a>
        </div>
    </header>

    <main class="auth-shell">
        <div class="auth-card auth-card--wide">
            <div class="auth-header">
                <span class="auth-eyebrow">الخطوة 2 من 2</span>
                <h1 class="auth-title">إيه خطوتك الجاية؟</h1>
                <p class="auth-subtitle">سجّل دخول أو اعمل حساب جديد كطالب</p>
            </div>

            <div class="auth-choice-grid auth-choice-grid--pair">
                <a href="login.html" class="choice-card" style="--c-accent: var(--mint); --c-soft: rgba(52, 211, 153, 0.1); --c-line: rgba(52, 211, 153, 0.34);">
                    <div class="choice-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    </div>
                    <h3 class="choice-title">تسجيل الدخول</h3>
                    <p class="choice-desc">أنا مسجّل هنا قبل كده</p>
                </a>

                <a href="register.html" class="choice-card" style="--c-accent: #8B5CF6; --c-soft: rgba(139, 92, 246, 0.10); --c-line: rgba(139, 92, 246, 0.34);">
                    <div class="choice-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </div>
                    <h3 class="choice-title">إنشاء حساب جديد</h3>
                    <p class="choice-desc">أنا جديد هنا — سجّلني</p>
                </a>
            </div>

            <div class="auth-note">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <p>مسجّل قبل كده؟ اختار تسجيل الدخول. الحساب الجديد بيبدأ فاضي</p>
            </div>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="join.html" class="auth-link">أنا مش طالب — ارجع</a>
            </div>
        </div>
    </main>

    <footer class="auth-footer">
        <p>&copy; 2026 إديوكيت. جميع الحقوق محفوظة.</p>
    </footer>
</body>
</html>
