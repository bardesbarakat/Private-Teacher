<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0F0D">
  <title>404 — الصفحة غير موجودة · EduPlatform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── 404 page reset ── */
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      background:#0B0F0D; color:#EAF2EE;
      font-family:'Cairo',sans-serif;
      display:flex; flex-direction:column;
      min-height:100vh; overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    /* ── Particle canvas ── */
    #particles-canvas {
      position:fixed; inset:0; pointer-events:none; z-index:0;
    }

    /* ── Centered main ── */
    .err-main {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:40px 20px;
      position:relative; z-index:1;
    }

    /* ── Giant 404 number ── */
    .err-num {
      font-family:'Space Grotesk', sans-serif;
      font-size:clamp(120px,25vw,280px);
      font-weight:700; line-height:.9;
      background:linear-gradient(135deg, #34D399 0%, #10A06A 40%, #7ee7b6 70%, #34D399 100%);
      background-size:200% 200%;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      animation:gradientShift 4s ease-in-out infinite, numberFloat 6s ease-in-out infinite;
      letter-spacing:-.04em;
      filter:drop-shadow(0 0 60px rgba(52,211,153,.35));
      position:relative;
    }

    @keyframes gradientShift {
      0%,100% { background-position:0% 50%; }
      50% { background-position:100% 50%; }
    }
    @keyframes numberFloat {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-18px); }
    }

    /* ── Glitch effect on the number ── */
    .err-num::before, .err-num::after {
      content:'404';
      position:absolute; top:0; left:0; right:0;
      background:inherit;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .err-num::before {
      animation:glitch1 4s ease-in-out infinite;
      clip-path:polygon(0 0,100% 0,100% 35%,0 35%);
    }
    .err-num::after {
      animation:glitch2 4s ease-in-out infinite;
      clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);
    }
    @keyframes glitch1 {
      0%,90%,100% { transform:none; opacity:0; }
      92% { transform:translate(-3px,2px); opacity:.6; filter:hue-rotate(90deg); }
      94% { transform:translate(3px,-2px); opacity:.6; filter:hue-rotate(-90deg); }
      96% { transform:none; opacity:0; }
    }
    @keyframes glitch2 {
      0%,93%,100% { transform:none; opacity:0; }
      95% { transform:translate(4px,1px); opacity:.5; filter:hue-rotate(180deg); }
      97% { transform:translate(-4px,-1px); opacity:.5; }
      99% { transform:none; opacity:0; }
    }

    /* ── Astronaut illustration ── */
    .err-astronaut {
      margin:20px auto 32px;
      position:relative; width:160px; height:160px;
    }
    .astronaut-body {
      width:100px; height:110px;
      background:linear-gradient(160deg,rgba(52,211,153,.15),rgba(20,61,42,.5));
      border:2px solid rgba(52,211,153,.35);
      border-radius:50px 50px 40px 40px;
      margin:0 auto; position:relative;
      animation:astFloat 4s ease-in-out infinite;
      box-shadow:0 0 40px rgba(52,211,153,.2);
    }
    .astronaut-helmet {
      width:70px; height:70px; border-radius:50%;
      background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(10,160,106,.1));
      border:2px solid rgba(52,211,153,.4);
      margin:-25px auto 0; position:relative;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 25px rgba(52,211,153,.25), inset 0 0 20px rgba(52,211,153,.08);
    }
    .astronaut-visor {
      width:44px; height:30px; border-radius:50%;
      background:linear-gradient(135deg,rgba(52,211,153,.3),rgba(16,160,106,.6));
      border:1px solid rgba(52,211,153,.5);
      display:flex; align-items:center; justify-content:center;
      font-size:18px;
    }
    .astronaut-arm-l, .astronaut-arm-r {
      position:absolute; top:30px; width:22px; height:50px;
      background:rgba(52,211,153,.15); border:1px solid rgba(52,211,153,.3);
      border-radius:11px;
    }
    .astronaut-arm-l { left:-28px; transform:rotate(15deg); animation:armL 4s ease-in-out infinite; }
    .astronaut-arm-r { right:-28px; transform:rotate(-15deg); animation:armR 4s ease-in-out infinite; }
    @keyframes astFloat { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-16px) rotate(2deg)} }
    @keyframes armL { 0%,100%{transform:rotate(15deg)} 50%{transform:rotate(30deg)} }
    @keyframes armR { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(-30deg)} }
    .err-astronaut .stars {
      position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none;
    }
    .star {
      position:absolute; border-radius:50%;
      background:var(--mint,#34D399);
      animation:twinkle var(--dur,2s) ease-in-out var(--del,0s) infinite;
    }
    @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }

    /* ── Text below astronaut ── */
    .err-title {
      font-size:clamp(20px,3.5vw,28px); font-weight:700;
      margin-bottom:10px; line-height:1.35;
    }
    .err-subtitle {
      font-size:clamp(15px,2vw,18px); color:#aebbb4;
      max-width:480px; margin:0 auto 36px; line-height:1.7;
    }
    .err-code-hint {
      font-family:'JetBrains Mono', monospace;
      font-size:13px; color:rgba(52,211,153,.6);
      margin-bottom:32px; display:flex; align-items:center; gap:8px; justify-content:center;
    }
    .err-code-hint::before, .err-code-hint::after { content:''; height:1px; width:40px; background:rgba(52,211,153,.2); }

    /* ── Buttons ── */
    .err-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .err-btn-primary {
      display:inline-flex; align-items:center; gap:9px;
      background:linear-gradient(135deg,#34D399,#10A06A); color:#04130C;
      font-weight:700; font-size:16px; padding:14px 28px; border-radius:14px;
      text-decoration:none; box-shadow:0 12px 30px rgba(52,211,153,.3);
      transition:filter .2s,transform .1s;
    }
    .err-btn-primary:hover { filter:brightness(1.08); transform:translateY(-2px); }
    .err-btn-secondary {
      display:inline-flex; align-items:center; gap:9px;
      border:1.5px solid rgba(255,255,255,.15); color:#EAF2EE;
      font-weight:600; font-size:16px; padding:13px 27px; border-radius:14px;
      text-decoration:none; background:rgba(255,255,255,.04);
      transition:border-color .2s,background .2s,transform .1s;
    }
    .err-btn-secondary:hover { border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.06); transform:translateY(-2px); }

    /* ── Radial glow ── */
    .err-glow {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:700px; height:700px; border-radius:50%; pointer-events:none; z-index:0;
      background:radial-gradient(circle,rgba(16,185,129,.12),transparent 60%);
      filter:blur(10px); animation:pulseGlow 7s ease-in-out infinite;
    }

    /* ── Mini footer ── */
    .err-footer {
      position:relative; z-index:1;
      padding:20px 24px; text-align:center;
      border-top:1px solid rgba(255,255,255,.07);
      font-size:13px; color:#6f817a;
    }
    .err-footer a { color:#6f817a; text-decoration:none; transition:color .2s; }
    .err-footer a:hover { color:#34D399; }
    .err-footer-inner { display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; }

    /* ── Back to top pulse ring ── */
    .pulse-ring {
      position:absolute; inset:-8px; border-radius:50%;
      border:1px solid rgba(52,211,153,.3); animation:ringPulse 2.5s ease-out infinite;
    }
    @keyframes ringPulse { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(1.5);opacity:0} }

    @keyframes pulseGlow { 0%,100%{opacity:.5} 50%{opacity:.95} }
  </style>
</head>
<body>

<!-- Particle canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Ambient glow -->
<div class="err-glow"></div>

<!-- Main 404 content -->
<main class="err-main">

  <!-- Giant 404 -->
  <div class="err-num" aria-label="404">404</div>

  <!-- Floating astronaut -->
  <div class="err-astronaut" aria-hidden="true">
    <div class="stars">
      <div class="star" style="width:4px;height:4px;top:10%;left:8%;--dur:2.1s;--del:.3s;"></div>
      <div class="star" style="width:3px;height:3px;top:20%;right:10%;--dur:1.8s;--del:.7s;"></div>
      <div class="star" style="width:5px;height:5px;top:70%;left:5%;--dur:2.4s;--del:1.1s;"></div>
      <div class="star" style="width:3px;height:3px;top:80%;right:8%;--dur:1.9s;--del:.4s;"></div>
      <div class="star" style="width:4px;height:4px;top:45%;left:2%;--dur:2.7s;--del:.9s;"></div>
      <div class="star" style="width:3px;height:3px;top:55%;right:3%;--dur:2.2s;--del:.2s;"></div>
    </div>
    <div class="astronaut-helmet">
      <div class="astronaut-visor">🌌</div>
    </div>
    <div class="astronaut-body">
      <div class="astronaut-arm-l"></div>
      <div class="astronaut-arm-r"></div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;">🚀</div>
    </div>
  </div>

  <!-- Text -->
  <div class="err-title">ضاع رائد الفضاء في الفضاء! 🛸</div>
  <p class="err-subtitle">الصفحة اللي بتدوّر عليها مش موجودة — ربما انتقلت لمكان تاني أو التمّ سحبها إلى الفضاء البعيد.</p>

  <div class="err-code-hint">
    <span>HTTP STATUS 404 · PAGE NOT FOUND</span>
  </div>

  <div class="err-btns">
    <a href="index.html" class="err-btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      العودة للرئيسية
    </a>
    <a href="catalog.html" class="err-btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="7" height="9"/><rect x="15" y="3" width="7" height="5"/>
        <rect x="15" y="12" width="7" height="9"/><rect x="2" y="16" width="7" height="5"/>
      </svg>
      تصفّح الكورسات
    </a>
  </div>

</main>

<!-- Mini footer -->
<footer class="err-footer">
  <div class="err-footer-inner">
    <span>© 2026 EduPlatform. جميع الحقوق محفوظة.</span>
    <a href="index.html">الرئيسية</a>
    <a href="contact.html">تواصل معنا</a>
    <a href="about.html">عن المنصة</a>
  </div>
</footer>

<script>
  /* ── Particle system: 30 floating circles ── */
  (function() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const MINT = '52,211,153';
    const TEAL = '16,160,106';

    // Create 30 particles
    const particles = Array.from({length: 30}, () => ({
      x:   Math.random() * window.innerWidth,
      y:   Math.random() * window.innerHeight,
      r:   Math.random() * 4 + 1.5,
      vx:  (Math.random() - 0.5) * 0.5,
      vy:  (Math.random() - 0.5) * 0.5,
      alpha: Math.random() * 0.5 + 0.15,
      pulse: Math.random() * Math.PI * 2,
      color: Math.random() > 0.5 ? MINT : TEAL
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const t = performance.now() / 1000;

      particles.forEach(p => {
        // Move
        p.x += p.vx;
        p.y += p.vy;

        // Wrap around edges
        if (p.x < -20)  p.x = canvas.width  + 20;
        if (p.x > canvas.width  + 20) p.x = -20;
        if (p.y < -20)  p.y = canvas.height + 20;
        if (p.y > canvas.height + 20) p.y = -20;

        // Pulsing alpha
        const a = p.alpha * (0.6 + 0.4 * Math.sin(t * 1.2 + p.pulse));

        // Glow
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        grad.addColorStop(0, 'rgba(' + p.color + ',' + a + ')');
        grad.addColorStop(1, 'rgba(' + p.color + ',0)');

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Core dot
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.color + ',' + Math.min(a * 2, 0.9) + ')';
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    draw();
  })();
</script>
</body>
</html>
