<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الاختبار - المنصة التعليمية</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint: #34D399;
            --mint-2: #10A06A;
            --bg-1: #0B0F0D;
            --bg-0: #14241C;
            --text: #EAF2EE;
            --text-soft: #aebbb4;
            --danger: #ef4444;
            --border: rgba(234, 242, 238, 0.1);
            --correct: #10B981;
            --wrong: #EF4444;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-1);
            color: var(--text);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--bg-0);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .summary-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--mint);
        }
        .stat-value.wrong { color: var(--danger); }
        .stat-label {
            font-size: 0.9rem;
            color: var(--text-soft);
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: var(--bg-0);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--mint); color: var(--mint); }
        .btn-primary { background: var(--mint); color: var(--bg-1); border: none; }
        .btn-primary:hover { background: var(--mint-2); color: var(--bg-1); }
        .btn-telegram { background: #0088cc; color: white; border: none; }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .review-card {
            background: var(--bg-0);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
        }

        .q-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .q-num {
            background: var(--bg-1);
            color: var(--mint);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            border: 1px solid var(--border);
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .code-block {
            background: var(--bg-1);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            margin: 1rem 0;
            direction: ltr;
            text-align: left;
            border: 1px solid var(--border);
            color: var(--mint);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .option-item {
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-1);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-item.correct {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--correct);
            color: var(--correct);
        }
        
        .option-item.wrong {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--wrong);
            color: var(--wrong);
        }

        .explanation {
            background: rgba(234, 242, 238, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border-right: 4px solid var(--mint);
            margin-top: 1rem;
            color: var(--text-soft);
            line-height: 1.6;
        }
        .explanation strong {
            color: var(--text);
            display: block;
            margin-bottom: 0.5rem;
        }

    </style>
</head>
<body>

    <header class="top-bar">
        <div class="summary-stats">
            <div class="stat-item">
                <span class="stat-value">75%</span>
                <span class="stat-label">النتيجة</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">7</span>
                <span class="stat-label">إجابات صحيحة</span>
            </div>
            <div class="stat-item">
                <span class="stat-value wrong">3</span>
                <span class="stat-label">إجابات خاطئة</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" style="color:var(--text);">8:32</span>
                <span class="stat-label">الوقت المستغرق</span>
            </div>
        </div>
        <div class="actions">
            <a href="dashboard.html" class="btn">لوحة التحكم</a>
            <button class="btn btn-telegram">مشاركة النتيجة</button>
        </div>
    </header>

    <div class="container" id="review-container">
        <!-- Questions injected via JS -->
    </div>

    <script>
        const questions = [
            { text: "ما هو ناتج الكود التالي؟", code: "print(type(5))", options: ["<class 'int'>", "<class 'str'>", "<class 'float'>", "5"], correct: 0, userAns: 0, exp: "الرقم 5 هو عدد صحيح (Integer)، لذلك تعيد دالة type() النوع int." },
            { text: "كيف يمكنك إنشاء دالة في بايثون؟", code: null, options: ["function my_func():", "def my_func():", "create my_func():", "func my_func():"], correct: 1, userAns: 1, exp: "في بايثون، نستخدم الكلمة المحجوزة def متبوعة باسم الدالة لتعريفها." },
            { text: "ما هي النتيجة الصحيحة للعملية التالية؟", code: "print(2 ** 3)", options: ["6", "9", "8", "16"], correct: 2, userAns: 0, exp: "المعامل ** يُستخدم لحساب الأسس، 2 أس 3 يساوي 8." }, // Wrong ans
            { text: "أي من التالي هو نوع بيانات غير قابل للتعديل (Immutable)؟", code: null, options: ["List", "Dictionary", "Set", "Tuple"], correct: 3, userAns: 3, exp: "الـ Tuple هو نوع بيانات يشبه القائمة ولكنه غير قابل للتعديل بعد إنشائه." },
            { text: "ما هو ناتج الكود التالي؟", code: "x = [1, 2, 3]\nprint(len(x))", options: ["2", "3", "4", "Error"], correct: 1, userAns: 1, exp: "دالة len() تعيد عدد العناصر داخل القائمة، وهو هنا 3 عناصر." },
            { text: "كيف يتم إضافة عنصر إلى نهاية القائمة؟", code: "my_list = [1, 2]", options: ["my_list.add(3)", "my_list.append(3)", "my_list.insert(3)", "my_list.push(3)"], correct: 1, userAns: 2, exp: "نستخدم الدالة append() لإضافة عنصر إلى نهاية القائمة في بايثون." }, // Wrong ans
            { text: "ما هو الرمز المستخدم للتعليقات في بايثون؟", code: null, options: ["//", "/* */", "#", "<!-- -->"], correct: 2, userAns: 2, exp: "يستخدم الرمز # لكتابة تعليق سطر واحد في بايثون." },
            { text: "ما هو ناتج العملية التالية؟", code: "print(10 // 3)", options: ["3.33", "3", "4", "1"], correct: 1, userAns: 1, exp: "المعامل // يقوم بالقسمة وإرجاع العدد الصحيح فقط بدون الباقي، لذا الناتج 3." },
            { text: "كيف يتم استيراد مكتبة في بايثون؟", code: null, options: ["import math", "include math", "require math", "using math"], correct: 0, userAns: 0, exp: "نستخدم الكلمة المحجوزة import لاستيراد المكتبات أو الوحدات الخارجية." },
            { text: "أي من هذه الكلمات المحجوزة تستخدم لإنهاء حلقة التكرار؟", code: null, options: ["stop", "exit", "return", "break"], correct: 3, userAns: 0, exp: "تستخدم الكلمة break للخروج الفوري من الحلقة التكرارية (Loop)." } // Wrong ans
        ];

        const container = document.getElementById('review-container');
        const labels = ['A', 'B', 'C', 'D'];

        questions.forEach((q, i) => {
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                let className = 'option-item';
                let icon = '';
                if (optIndex === q.correct) {
                    className += ' correct';
                    icon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
                } else if (optIndex === q.userAns && q.userAns !== q.correct) {
                    className += ' wrong';
                    icon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';
                }

                optionsHtml += `
                    <div class="${className}">
                        <span><strong>${labels[optIndex]}.</strong> ${opt}</span>
                        ${icon}
                    </div>
                `;
            });

            const codeHtml = q.code ? `<div class="code-block">${q.code.replace(/\n/g, '<br>')}</div>` : '';

            const card = document.createElement('div');
            card.className = 'review-card';
            card.innerHTML = `
                <div class="q-header">
                    <div class="q-num">${i + 1}</div>
                    <div class="q-text">${q.text}</div>
                </div>
                ${codeHtml}
                <div class="options-list">
                    ${optionsHtml}
                </div>
                <div class="explanation">
                    <strong>الشرح:</strong>
                    ${q.exp}
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
