<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - المنصة التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="dot-grid"></div>
    <div class="auth-glow"></div>

    <header class="auth-nav">
        <div class="nav-brand">
            <div class="brand-logo">E</div>
            <span class="brand-name">إديوكيت</span>
        </div>
        <div class="nav-actions">
            <button class="btn-ghost">EN</button>
            <a href="index.html" class="btn-ghost">العودة</a>
        </div>
    </header>

    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-eyebrow">مرحبًا بعودتك</span>
                <h1 class="auth-title">تسجيل الدخول</h1>
                <p class="auth-subtitle">أدخل بياناتك للوصول لكورساتك</p>
            </div>

            <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" class="auth-input" placeholder="name@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <div class="input-with-icon" style="position: relative;">
                        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                        <button type="button" class="btn-icon" onclick="togglePassword()" title="إظهار/إخفاء" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <label class="checkbox-label" style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-soft); font-size: 0.875rem;">
                        <input type="checkbox" checked>
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="auth-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="auth-btn auth-btn--mint" id="submitBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                    <span class="btn-loader" style="display: none; align-items: center; justify-content: center;">
                        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><style>.spinner_P7sC{transform-origin:center;animation:spinner_svv2 .75s infinite linear}@keyframes spinner_svv2{100%{transform:rotate(360deg)}}</style><path d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z" class="spinner_P7sC"/></svg>
                    </span>
                </button>
            </form>

            <div class="auth-divider">
                <span>أو</span>
            </div>

            <div class="social-login" style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn-ghost" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: 1px solid var(--bg-border); background: var(--bg-1);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button" class="btn-ghost" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: 1px solid var(--bg-border); background: var(--bg-1);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </button>
            </div>

            <p class="auth-footer-text" style="text-align: center; margin-top: 1.5rem; color: var(--text-soft); font-size: 0.875rem;">
                ليس لديك حساب؟ <a href="register.html" class="auth-link">سجّل الآن</a>
            </p>
        </div>
    </main>

    <footer class="auth-footer">
        <p>&copy; 2026 إديوكيت. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                pwd.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.btn-loader');
            
            btn.disabled = true;
            btn.style.opacity = '0.7';
            text.style.display = 'none';
            loader.style.display = 'inline-flex';
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
    </script>
</body>
</html>
